version: '3.7'
services:
  mermaid:
    build:
      context: .
      target: mermaid-dev
    volumes:
      - ./src:/app/src
    ports:
      - "${PORT:-3000}:3000"
      - "24678:24678"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    labels:
      - "coolify.managed=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
